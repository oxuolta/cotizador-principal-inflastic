<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="INFLASTIC Cotizador">
<meta name="mobile-web-app-capable" content="yes">
<title>INFLASTIC · Cotizador Principal con IA</title>
<style>
:root{
  --nav:#0b2f6f;--nav2:#08265a;--ink:#14213d;--muted:#667085;--bg:#f6f8fc;
  --card:#fff;--line:#e3e8f0;--teal:#14b8a6;--blue:#2563eb;--orange:#f97316;
  --pink:#ec4899;--purple:#7c3aed;--green:#16a34a;
}
*{box-sizing:border-box}
body{margin:0;font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;background:var(--bg);color:var(--ink)}
button,input,textarea,select{font:inherit}
.app{display:grid;grid-template-columns:230px 1fr;min-height:100vh}
aside{background:linear-gradient(180deg,var(--nav),var(--nav2));color:#fff;padding:20px 14px;display:flex;flex-direction:column;gap:18px}
.brand{display:flex;align-items:center;gap:12px;padding:4px 8px 14px}
.logo{width:58px;height:58px;border-radius:50%;background:conic-gradient(#22c55e,#38bdf8,#7c3aed,#ec4899,#f97316,#facc15,#22c55e);border:4px solid #fff3}
.brand b{font-size:22px;letter-spacing:.5px}
.brand small{display:block;color:#cde7ff;margin-top:2px}
nav{display:grid;gap:6px}
nav button{border:0;background:transparent;color:#e9f2ff;text-align:left;padding:13px 14px;border-radius:12px;min-height:48px}
nav button.active{background:linear-gradient(90deg,#0ea5e9,#14b8a6);color:white;font-weight:800}
aside .foot{margin-top:auto;border-top:1px solid #ffffff22;padding-top:14px;color:#d8e6ff;font-size:13px}
main{padding:22px;min-width:0}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;margin-bottom:16px}
h1{font-size:clamp(28px,4vw,44px);margin:0} .sub{color:var(--muted);margin-top:6px}
.status{display:flex;gap:10px;flex-wrap:wrap;justify-content:flex-end}
.pill{background:#fff;border:1px solid var(--line);padding:10px 12px;border-radius:12px;box-shadow:0 4px 16px #102a4310;font-weight:700}
.gridTop{display:grid;grid-template-columns:1.1fr .9fr;gap:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px;box-shadow:0 6px 24px #102a4310}
.aiCard{border:2px solid transparent;background:linear-gradient(#fff,#fff) padding-box,linear-gradient(100deg,#7c3aed,#ec4899,#f59e0b) border-box}
.card h2{margin:0 0 12px;font-size:20px}
textarea{width:100%;min-height:150px;resize:vertical;border:1px solid #d6dce8;border-radius:14px;padding:14px;font-size:17px}
.modeRow,.actionRow{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}
.btn{border:0;border-radius:12px;padding:12px 16px;min-height:48px;font-weight:800;cursor:pointer}
.btn.write{background:#ede9fe;color:#6d28d9}.btn.voice{background:#d1fae5;color:#047857}.btn.attach{background:#ffedd5;color:#c2410c}
.btn.interpret{background:linear-gradient(90deg,#7c3aed,#6366f1);color:white}.btn.quote{background:linear-gradient(90deg,#16a34a,#059669);color:white}
.btn.clear{background:#eef2f7;color:#475467}.mic{width:82px;height:82px;border-radius:50%;border:0;background:linear-gradient(135deg,#2563eb,#7c3aed);color:#fff;font-size:34px;margin:8px auto;display:block;box-shadow:0 0 0 12px #7c3aed12}
.mic.recording{animation:pulse 1s infinite;background:linear-gradient(135deg,#ef4444,#ec4899)}
.mic[aria-pressed="true"]{transform:scale(.98)}
.voiceStatus{text-align:center;color:#667085;font-weight:700;min-height:22px;margin-top:2px}
textarea[readonly]{background:#f8fafc;color:#334155}
@keyframes pulse{50%{box-shadow:0 0 0 20px #ec489922}}
.fields{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.field{border:1px solid #d9ebe8;background:#f8fffd;border-radius:12px;padding:10px}
.field label{display:block;font-size:12px;color:#0f766e;font-weight:800}
.field input{border:0;background:transparent;width:100%;font-weight:750;color:var(--ink);padding:4px 0 0;outline:none}
.full{grid-column:1/-1}
.summary{margin-top:16px}
.tableWrap{overflow:auto}
table{width:100%;border-collapse:collapse;min-width:600px}
th,td{padding:11px;border-bottom:1px solid #edf0f5;text-align:left}
th{color:#0f766e;background:#f0fdfa}
.notice{margin-top:12px;border-radius:12px;padding:12px;background:#fff7ed;color:#9a3412;font-weight:700}
.categories{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin-top:16px}
.cat{background:#fff;border:1px solid var(--line);border-radius:16px;padding:12px;text-align:center;min-height:116px;cursor:pointer}
.cat .ico{font-size:38px;display:block;margin-bottom:6px}.cat b{font-size:14px}
.cat.selected{outline:3px solid #14b8a644;background:#f0fdfa}
.flow{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:16px}
.step{background:#fff;border:1px solid var(--line);border-radius:16px;padding:12px}
.step .n{display:inline-grid;place-items:center;width:34px;height:34px;border-radius:50%;color:#fff;font-weight:900;margin-right:8px}
.step:nth-child(1) .n{background:#7c3aed}.step:nth-child(2) .n{background:#2563eb}.step:nth-child(3) .n{background:#f97316}.step:nth-child(4) .n{background:#16a34a}
#msg{min-height:24px;margin:10px 0 0;font-weight:700;color:#0f766e}
.fileInput{display:none}
@media(max-width:980px){.app{grid-template-columns:1fr}aside{display:none}.gridTop{grid-template-columns:1fr}.categories{grid-template-columns:repeat(3,1fr)}}
@media(max-width:600px){main{padding:14px}.top{flex-direction:column}.status{justify-content:flex-start}.fields{grid-template-columns:1fr}.full{grid-column:auto}.categories{grid-template-columns:repeat(2,1fr)}.flow{grid-template-columns:1fr 1fr}.btn{flex:1}.mic{width:96px;height:96px}}

.sectionTitle{grid-column:1/-1;font-size:13px;font-weight:900;color:#334155;margin-top:6px;padding:8px 10px;background:#eef6f5;border-radius:10px}
.field select{border:0;background:transparent;width:100%;font-weight:750;color:var(--ink);padding:4px 0 0;outline:none}
details.interp{grid-column:1/-1;border:1px solid #e5e7eb;border-radius:12px;background:#fff}
details.interp>summary{cursor:pointer;padding:10px 12px;font-weight:900;color:#0f766e;list-style:none}
details.interp>summary::-webkit-details-marker{display:none}
details.interp .inside{padding:0 10px 10px;display:grid;grid-template-columns:1fr 1fr;gap:10px}
.badgeWarn{display:inline-block;padding:5px 8px;border-radius:999px;background:#fff7ed;color:#9a3412;font-size:12px;font-weight:800}
#interpretWarnings{grid-column:1/-1;padding:9px 11px;border-radius:10px;background:#f8fafc;color:#475569;font-size:13px;line-height:1.35}
@media(max-width:600px){details.interp .inside{grid-template-columns:1fr}}


/* ===== v5.6 · ACCESO PRIVADO + RECUPERACIÓN POR CORREO ===== */
const CONTROL_URL_KEY='INFLASTIC_CONTROL_ODP_URL_V1';
let MAIN_AUTHENTICATED=false;
let AUTH_BRIDGE_READY=false;
let RECOVERY_NONCE='';
let ACCESS_STATUS=null;
let REQ_SEQ=0;
const ACCESS_PENDING=new Map();

function setActiveNav(which){
  const a=$('navCotizador'),b=$('navControl');
  if(a)a.classList.toggle('active',which==='cotizador');
  if(b)b.classList.toggle('active',which==='control');
}
function validControlUrl(url){
  try{
    const u=new URL(String(url||'').trim());
    return u.protocol==='https:' &&
      (u.hostname==='script.google.com' || u.hostname.endsWith('.googleusercontent.com'));
  }catch(e){return false}
}
function storedControlUrl(){return String(localStorage.getItem(CONTROL_URL_KEY)||'').trim()}
function authUrl(base){return base+(base.includes('?')?'&':'?')+'auth=1'}

function configureFrames(){
  const saved=storedControlUrl();
  const input=$('mainControlUrl');
  if(input && !input.value)input.value=saved;
  if(!saved || !validControlUrl(saved))return;
  const control=$('controlFrame'),auth=$('authBridgeFrame');
  if(control)control.src=saved;
  if(auth)auth.src=authUrl(saved);
}
function showCotizador(){
  if(!MAIN_AUTHENTICATED)return;
  $('cotizadorView')?.classList.remove('hidden');
  $('controlView')?.classList.add('hidden');
  setActiveNav('cotizador');
}
function openControl(){
  if(!MAIN_AUTHENTICATED)return;
  const url=storedControlUrl();
  if(!url || !validControlUrl(url))return;
  const frame=$('controlFrame');
  if(frame && frame.src!==url)frame.src=url;
  $('cotizadorView')?.classList.add('hidden');
  $('controlView')?.classList.remove('hidden');
  setActiveNav('control');
}
function setLoginMessage(msg,bad=true){
  const el=$('mainLoginMsg');
  if(!el)return;
  el.textContent=msg||'';
  el.style.color=bad?'#ad332e':'#177245';
}
function showMode(mode){
  $('loginMode').style.display=mode==='login'?'block':'none';
  $('setupMode').style.display=mode==='setup'?'block':'none';
  $('recoveryMode').style.display=mode==='recovery'?'block':'none';
  setLoginMessage('');
  if(mode==='setup'){
    $('mainLoginTitle').textContent='Crear acceso';
    $('mainLoginSub').textContent='Configura tu contraseña y correo de recuperación';
    setTimeout(()=>$('setupPassword1')?.focus(),80);
  }else if(mode==='recovery'){
    $('mainLoginTitle').textContent='Recuperar acceso';
    $('mainLoginSub').textContent='Recuperación segura por correo';
  }else{
    $('mainLoginTitle').textContent='INFLASTIC 360';
    $('mainLoginSub').textContent='Acceso general al sistema';
    setTimeout(()=>$('mainPassword')?.focus(),80);
  }
}
function accessRequest(action,payload={}){
  return new Promise((resolve,reject)=>{
    if(!AUTH_BRIDGE_READY)return reject(new Error('El validador todavía no está listo.'));
    const requestId='r'+Date.now()+'_'+(++REQ_SEQ);
    const timer=setTimeout(()=>{
      ACCESS_PENDING.delete(requestId);
      reject(new Error('La validación tardó demasiado. Intenta de nuevo.'));
    },12000);
    ACCESS_PENDING.set(requestId,{resolve,reject,timer});
    try{
      $('authBridgeFrame').contentWindow.postMessage(
        {type:'INFLASTIC_MAIN_ACCESS',action,payload,requestId},
        '*'
      );
    }catch(e){
      clearTimeout(timer);ACCESS_PENDING.delete(requestId);reject(e);
    }
  });
}
async function refreshAccessStatus(){
  try{
    ACCESS_STATUS=await accessRequest('status');
    if(ACCESS_STATUS?.configured)showMode('login');
    else showMode('setup');
  }catch(e){setLoginMessage(e.message)}
}
async function mainLogin(){
  const pwd=String($('mainPassword')?.value||'');
  if(!pwd)return setLoginMessage('Escribe tu contraseña.');
  const btn=$('mainLoginBtn');btn.disabled=true;btn.textContent='VERIFICANDO…';
  try{
    const r=await accessRequest('verify',{password:pwd});
    if(!r?.ok)return setLoginMessage(r?.message||'Contraseña incorrecta.');
    MAIN_AUTHENTICATED=true;
    document.body.classList.remove('authLocked');
    $('mainPassword').value='';
    $('mainLogin').classList.add('hidden');
    showCotizador();
  }catch(e){setLoginMessage(e.message)}
  finally{btn.disabled=false;btn.textContent='ENTRAR'}
}
async function setupAccess(){
  const p1=String($('setupPassword1')?.value||'');
  const p2=String($('setupPassword2')?.value||'');
  const email=String($('setupEmail')?.value||'').trim();
  if(p1.length<8)return setLoginMessage('Usa al menos 8 caracteres.');
  if(p1!==p2)return setLoginMessage('Las contraseñas no coinciden.');
  if(!email)return setLoginMessage('Captura tu correo de recuperación.');
  const btn=$('setupAccessBtn');btn.disabled=true;btn.textContent='GUARDANDO…';
  try{
    const r=await accessRequest('setup',{password:p1,email});
    if(!r?.ok)return setLoginMessage(r?.message||'No fue posible crear el acceso.');
    $('setupPassword1').value='';$('setupPassword2').value='';
    showMode('login');
    setLoginMessage('Acceso creado. Ya puedes entrar.',false);
  }catch(e){setLoginMessage(e.message)}
  finally{btn.disabled=false;btn.textContent='CREAR ACCESO'}
}
async function sendRecovery(){
  const btn=$('sendRecoveryBtn');btn.disabled=true;btn.textContent='ENVIANDO…';
  try{
    const r=await accessRequest('requestRecovery');
    if(!r?.ok)return setLoginMessage(r?.message||'No fue posible enviar el código.');
    RECOVERY_NONCE=String(r.nonce||'');
    $('recoveryStep1').style.display='none';
    $('recoveryStep2').style.display='block';
    setLoginMessage('Código enviado a '+(r.recoveryEmailMasked||'tu correo')+'.',false);
    setTimeout(()=>$('recoveryCode')?.focus(),80);
  }catch(e){setLoginMessage(e.message)}
  finally{btn.disabled=false;btn.textContent='ENVIAR CÓDIGO'}
}
async function resetPassword(){
  const code=String($('recoveryCode')?.value||'').trim();
  const p1=String($('recoveryPass1')?.value||'');
  const p2=String($('recoveryPass2')?.value||'');
  if(!/^\d{6}$/.test(code))return setLoginMessage('Captura el código de 6 dígitos.');
  if(p1.length<8)return setLoginMessage('La nueva contraseña debe tener al menos 8 caracteres.');
  if(p1!==p2)return setLoginMessage('Las contraseñas no coinciden.');
  const btn=$('resetPasswordBtn');btn.disabled=true;btn.textContent='CAMBIANDO…';
  try{
    const r=await accessRequest('resetWithCode',{nonce:RECOVERY_NONCE,code,newPassword:p1});
    if(!r?.ok)return setLoginMessage(r?.message||'No fue posible cambiar la contraseña.');
    $('recoveryCode').value='';$('recoveryPass1').value='';$('recoveryPass2').value='';
    showMode('login');
    setLoginMessage('Contraseña actualizada. Ya puedes entrar.',false);
  }catch(e){setLoginMessage(e.message)}
  finally{btn.disabled=false;btn.textContent='CAMBIAR CONTRASEÑA'}
}

window.addEventListener('message',e=>{
  const d=e.data||{};
  if(d.type==='INFLASTIC_MAIN_BRIDGE_READY'){
    AUTH_BRIDGE_READY=true;
    refreshAccessStatus();
    return;
  }
  if(d.type==='INFLASTIC_MAIN_RESPONSE'){
    const p=ACCESS_PENDING.get(String(d.requestId||''));
    if(!p)return;
    clearTimeout(p.timer);ACCESS_PENDING.delete(String(d.requestId||''));
    p.resolve(d.result||{ok:false,message:'Respuesta inválida.'});
  }
});

$('mainLoginBtn')?.addEventListener('click',mainLogin);
$('mainPassword')?.addEventListener('keydown',e=>{if(e.key==='Enter')mainLogin()});
$('setupAccessBtn')?.addEventListener('click',setupAccess);
$('forgotBtn')?.addEventListener('click',()=>showMode('recovery'));
$('backLoginBtn')?.addEventListener('click',()=>{ $('recoveryStep1').style.display='block';$('recoveryStep2').style.display='none';showMode('login')});
$('sendRecoveryBtn')?.addEventListener('click',sendRecovery);
$('resendRecoveryBtn')?.addEventListener('click',()=>{ $('recoveryStep1').style.display='block';$('recoveryStep2').style.display='none';sendRecovery()});
$('resetPasswordBtn')?.addEventListener('click',resetPassword);

$('mainControlUrl')?.addEventListener('change',()=>{
  const u=String($('mainControlUrl')?.value||'').trim();
  if(!validControlUrl(u))return;
  localStorage.setItem(CONTROL_URL_KEY,u);
  AUTH_BRIDGE_READY=false;
  $('authBridgeFrame').src=authUrl(u);
  $('controlFrame').src=u;
  setLoginMessage('Conexión guardada.',false);
});
$('navCotizador')?.addEventListener('click',showCotizador);
$('navControl')?.addEventListener('click',openControl);

configureFrames();
setTimeout(()=>{
  if(!storedControlUrl())setLoginMessage('Abre Configuración de conexión y pega la URL de CONTROL ODP.');
},350);

/* Actualiza el resumen compacto después de cualquier interpretación. */
const _syncCompactObserver=new MutationObserver(syncCompactPrintFields);
['impresion','tintas','vistas','gajosVista'].forEach(id=>{
  const el=$(id);
  if(el) _syncCompactObserver.observe(el,{attributes:true,childList:true,subtree:true});
});
setTimeout(syncCompactPrintFields,0);

</script>
</body>
</html>
<!-- INFLASTIC v5.6: CONTROL ODP integrado sin barra superior redundante -->
